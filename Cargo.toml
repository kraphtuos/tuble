[package]
name = "tuble"
version = "0.1.0"
edition = "2021"

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
yew = { version = "0.20", features = ["csr"] }

# The optimiser tests search the whole game tree, which is slow unoptimised.
[profile.test]
opt-level = 3

# build.rs runs the first searches, which are slow unoptimised.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
